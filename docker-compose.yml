version: '3.8'

services:
  zammad-max-bot:
    build: .
    container_name: zammad-max-bot
    restart: unless-stopped
    ports:
      - "8081:8081"  
    volumes:
      # Базы данных
      - bot-data:/app/data
      # Отчёты
      - bot-reports:/app/reports
      # Логи
      - bot-logs:/app/logs
      # Временные файлы
      - bot-temp:/app/temp
    environment:
      # Читаем из .env файла
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN}
      - ZAMMAD_URL=${ZAMMAD_URL}
      - ZAMMAD_TOKEN=${ZAMMAD_TOKEN}
      - ZAMMAD_USER_EMAIL=${ZAMMAD_USER_EMAIL}
      - ZAMMAD_DEFAULT_GROUP=${ZAMMAD_DEFAULT_GROUP}
      - ZAMMAD_DEFAULT_PRIORITY=${ZAMMAD_DEFAULT_PRIORITY}
      - BOT_LANGUAGE=${BOT_LANGUAGE}
      - ENABLE_WEBHOOK=${ENABLE_WEBHOOK}
      - WEBHOOK_HOST=${WEBHOOK_HOST}
      - WEBHOOK_PORT=${WEBHOOK_PORT}
      - CARTRIDGE_CHAT_ID=${CARTRIDGE_CHAT_ID}
      - CARTRIDGE_DB_URL=${CARTRIDGE_DB_URL}
      - CARTRIDGE_REPORTS_DIR=${CARTRIDGE_REPORTS_DIR}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  bot-data:
  bot-reports:
  bot-logs:
  bot-temp:
